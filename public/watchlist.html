<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Radar — Lista de Vigilância</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101114; --panel: #17181c; --line: #2b2d33; --ink: #f3f2ee;
    --muted: #8b8d94; --accent: #e7b24a; --good: #5fcb8f; --bad: #e2604a;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  nav { display:flex; gap:24px; padding:18px 32px; border-bottom:1px solid var(--line); }
  nav a { color: var(--muted); text-decoration:none; font-size:13px; font-weight:500; padding-bottom:4px; border-bottom:2px solid transparent; }
  nav a.active { color: var(--ink); border-bottom-color: var(--accent); }

  .masthead { padding: 28px 32px 8px; }
  .wordmark { font-family: var(--font-display); font-weight:700; font-size:24px; margin:0; letter-spacing:-0.02em; }
  .wordmark span { color: var(--accent); }
  .tagline { font-size:13px; color: var(--muted); margin:4px 0 0; }

  .add-form {
    margin: 20px 32px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line);
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
  }
  .add-form .field { flex:1; min-width:220px; }
  .add-form label { display:block; font-size:12px; color: var(--muted); margin-bottom:6px; }
  .add-form input, .add-form select {
    width:100%; background:#0d0e10; border:1px solid var(--line); color: var(--ink);
    padding:9px 10px; font-family: var(--font-body); font-size:13px;
  }
  .add-form button {
    background: var(--accent); color:#1a1204; border:none; font-weight:600; font-size:13px;
    padding:10px 18px; cursor:pointer;
  }
  .add-form button:disabled { opacity:0.6; cursor:wait; }
  #addMsg { width:100%; font-size:12px; color: var(--muted); }

  .group-block { margin: 28px 32px; }
  .group-title { font-family: var(--font-display); font-weight:600; font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .group-count { font-family: var(--font-body); font-weight:400; font-size:12px; color: var(--muted); }

  .p-list { display:flex; flex-direction:column; gap:1px; background:var(--line); }
  .p-row { background: var(--panel); padding:12px 16px; display:flex; align-items:center; gap:14px; }
  .p-row img { width:44px; height:44px; object-fit:contain; background:#fff; flex-shrink:0; }
  .p-title { flex:1; font-size:13px; }
  .p-checked { font-size:11px; color: var(--muted); white-space:nowrap; }
  .p-row a { color: var(--muted); text-decoration:none; font-size:12px; margin-left:10px; }
  .p-row a:hover { color: var(--accent); }
  .p-row button.remove { background:none; border:none; color: var(--bad); cursor:pointer; font-size:12px; margin-left:10px; }

  .empty-note { padding: 40px 32px; color: var(--muted); font-size:13px; }
</style>
</head>
<body>

  <nav>
    <a href="index.html">Painel geral</a>
    <a href="marketplaces.html">Marketplaces</a>
    <a href="watchlist.html" class="active">Lista de vigilância</a>
  </nav>

  <div class="masthead">
    <h1 class="wordmark">Vigilância<span>.</span></h1>
    <p class="tagline">Cole o link de um produto do Mercado Livre e escolha em qual grupo ele entra</p>
  </div>

  <div class="add-form">
    <div class="field">
      <label>Link do produto</label>
      <input type="text" id="urlInput" placeholder="https://produto.mercadolivre.com.br/MLB-..." />
    </div>
    <div class="field" style="max-width:220px;">
      <label>Grupo</label>
      <select id="groupSelect"></select>
    </div>
    <button id="addBtn">Adicionar</button>
    <div id="addMsg"></div>
  </div>

  <div id="groups"></div>
  <div id="emptyNote" class="empty-note" style="display:none">Nenhum produto vigiado ainda. Cole um link acima para começar.</div>

  <script src="watchlist.js"></script>
</body>
</html>
